[package]
name = "jsexec"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Extensible, offline JavaScript analysis CLI"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
oxc_allocator = "=0.102.0"
oxc_ast = { version = "=0.102.0", features = ["serialize"] }
oxc_ast_visit = "=0.102.0"
oxc_codegen = "=0.102.0"
oxc_parser = "=0.102.0"
oxc_span = "=0.102.0"
oxc_syntax = "=0.102.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
html5ever = "0.27"
markup5ever_rcdom = "0.3"
base64 = "0.22"
percent-encoding = "2.3"
regex = "1.12"
sha2 = "0.10"
